services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minifin}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      LOCAL_DB_URL: jdbc:mysql://mysql:3306/minifin
      LOCAL_DB_USERNAME: root
      LOCAL_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-my-default-secret-key-change-in-production}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-86400000}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./src/front-end-next
      dockerfile: Dockerfile

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
