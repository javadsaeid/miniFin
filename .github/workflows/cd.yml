name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package JAR
        run: ./mvnw package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/front-end-next
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

  deploy-readme:
    name: Deploy Instructions
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Generate pull instructions
        run: |
          cat <<EOF
          ## Images published to GitHub Container Registry

          - ghcr.io/${{ github.repository }}-backend:latest
          - ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          - ghcr.io/${{ github.repository }}-frontend:latest
          - ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}

          ## Local deploy

          1. Login:
             echo "\$GITHUB_PAT" | docker login ghcr.io -u USERNAME --password-stdin

          2. Pull images:
             docker compose pull

          3. Start:
             docker compose up -d

          4. Access: https://localhost:8443
          EOF
