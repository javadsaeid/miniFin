spring.application.name=minFin
spring.config.import=optional:file:.env[.properties]

server.port=8080
# MySQL database connection properties
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}
# The driver class name using the modern "cj" driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.security.user.name=user
spring.security.user.password=test
# Hibernate/JPA properties
spring.jpa.hibernate.ddl-auto=validate
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Specifies the correct dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enables logging of SQL queries to the console (optional, good for development)
spring.jpa.show-sql=true 


#jwt config
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}

# mail config
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# enable tls smpt mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls=true
spring.mail.properties.mail.smtp.starttls.required=true

# password reset link
password.reset.link=http://localhost:8080/reset-password?code=

# springdoc / swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.info.app.version=1.0.0

# Custom health indicator
management.health.db.enabled=true

# Structured logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%.10thread] %-5level logger='%logger{36}' traceId='%X{traceId:-}' spanId='%X{spanId:-}' msg='%msg'%n
logging.level.com.miniFin.minFin=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/minifin.log
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%.10thread] %-5level %logger{36} - %msg%n
